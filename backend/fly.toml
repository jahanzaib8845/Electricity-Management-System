app = "wind-forecast-backend"

primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  FRONTEND_ORIGIN = "https://wind-forecast-frontend.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  min_machines_running = 0
  processes = ["app"]

[[http_services.ports]]
  port = 80
  handlers = ["http"]

[[http_services.ports]]
  port = 443
  handlers = ["tls", "http"]

[[services.ports]]
  port = 80
  handlers = ["http"]

[[services.ports]]
  port = 443
  handlers = ["tls", "http"]
